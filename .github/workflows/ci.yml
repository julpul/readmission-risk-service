name: CI_smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: setup uv
        uses: astral-sh/setup-uv@v9
        with:
          version: 'latest'
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: lint
        run: |
          uv run ruff check .

      - name: test
        run: |
          uv run pytest
