[project]
name = "readmission-risk-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Julian Pulawski", email = "s31873@pjwstk.edu.pl" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.5",
    "pandera>=0.32.1",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[project.scripts]
readmission-risk-service = "readmission_risk_service:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "E501", "B018"]
